<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b5d43">
<title>DZIRO — переехали</title>
<link rel="icon" href="logo.png">
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8efe3;color:#2b3527;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.c{max-width:360px}img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 10px}p{color:#5d6a57;margin:0 0 22px}
a{display:inline-block;background:#4b5d43;color:#fff;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:12px}
small{display:block;margin-top:18px;color:#7c8776;font-size:13px}
</style>
</head>
<body>
<div class="c">
<img src="logo.png" alt="">
<h1>Приложение переехало</h1>
<p>Теперь DZIRO — одно приложение для всех: мастера, зал и бар. Войди по своему имени и прежнему коду.</p>
<a href="../dziro/" id="go">Открыть DZIRO</a>
<small>Удали старую иконку с экрана «Домой» и добавь новую, затем снова включи уведомления.</small>
</div>
<script>
const g = new URLSearchParams(location.search).get('go');
const u = '../dziro/' + (g ? '?go=' + encodeURIComponent(g) : '');
document.getElementById('go').href = u;
if (!(navigator.standalone || matchMedia('(display-mode: standalone)').matches)) setTimeout(() => location.replace(u), 1200);
</script>
</body>
</html>
